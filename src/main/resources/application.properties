spring.application.name=praxis

# Banco relacional (H2 em memoria para desenvolvimento; troca para PostgreSQL
# altera apenas este bloco, nunca o dominio).
spring.datasource.url=jdbc:h2:mem:praxis;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Em dev o esquema vem do Hibernate (H2 em memoria). O Flyway so roda no perfil
# prod, sobre PostgreSQL - ver application-prod.properties e db/migration.
spring.flyway.enabled=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Motor de prazos: varredura diaria as 7h em dias uteis.
praxis.varredura-prazos.cron=0 0 7 * * MON-FRI
praxis.dados-exemplo=true

# Anexos: o limite de dominio e 10 MB por arquivo (ArquivoAnexo). Aqui fica um
# pouco acima para a recusa vir do dominio com mensagem clara, e nao do servlet.
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB

# Acesso ao painel (/painel/**): sessao HTTP. Usuarios iniciais (um chefe e os
# dois advogados dos processos de exemplo) entram com esta senha; troque em
# producao ou desligue a carga com praxis.usuarios-iniciais=false.
praxis.usuarios-iniciais=true
praxis.senha-inicial=praxis123
# Administrador (chefe) de login curto: entra digitando so "admin". Sem senha
# configurada, nao e criado. Dominio completa logins sem "@".
praxis.dominio-email=praxis.adv.br
praxis.admin.usuario=admin
praxis.admin.senha=123
# true: usuarios iniciais entram com senha provisoria e caem na troca de senha no primeiro acesso.
praxis.exigir-troca-senha-inicial=false
server.servlet.session.timeout=8h
# Sessao so por cookie: sem ";jsessionid=" em URL (vazaria em log, historico e Referer).
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
