spring.application.name=praxis

# Banco relacional (H2 em memoria para desenvolvimento; troca para PostgreSQL
# altera apenas este bloco, nunca o dominio).
spring.datasource.url=jdbc:h2:mem:praxis;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Motor de prazos: varredura diaria as 7h em dias uteis.
praxis.varredura-prazos.cron=0 0 7 * * MON-FRI
praxis.dados-exemplo=true

# Anexos: o limite de dominio e 10 MB por arquivo (ArquivoAnexo). Aqui fica um
# pouco acima para a recusa vir do dominio com mensagem clara, e nao do servlet.
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB
