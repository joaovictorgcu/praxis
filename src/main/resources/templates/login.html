<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praxis - entrar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%2314213d%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2718%27 font-family=%27Segoe UI,Arial%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27%23ffffff%27%3EP%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" th:href="@{/css/praxis.css}">
  <script th:src="@{/js/praxis.js}" defer></script>
</head>
<body class="entrada">
<main id="conteudo" tabindex="-1" class="cartao-login">
  <h1>Praxis</h1>
  <p class="apoio">Gestao de processos, prazos e pecas do escritorio.</p>

  <p th:if="${mensagem}" class="mensagem sucesso" role="status" th:text="${mensagem}">ok</p>
  <p th:if="${erro}" class="mensagem erro" role="alert" th:text="${erro}">erro</p>

  <form th:action="@{/login}" method="post" class="empilhado">
    <input type="hidden" name="proximo" th:value="${proximo}">
    <label>Usuario ou e-mail
      <input type="text" name="email" th:value="${email}" required autofocus
             autocomplete="username" placeholder="admin ou voce@praxis.adv.br">
    </label>
    <label>Senha
      <input type="password" name="senha" required autocomplete="current-password">
    </label>
    <button type="submit">Entrar</button>
  </form>

  <p class="dica">
    Advogado entra para conduzir os autos; chefe (socio) tambem aprova pecas e
    administra feriados e modelos. Sem conta? Peca ao chefe do escritorio.
  </p>
</main>
</body>
</html>
