<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praxis - Entrar</title>
  <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
  <link rel="stylesheet" th:href="${assetCss}">
  <script th:src="${assetJs}" defer></script>
</head>
<body class="entrada">
<header class="topo-entrada">
  <img class="marca-topo" th:src="@{/favicon.svg}" width="96" height="96"
       alt="Praxis - gestão para escritórios de advocacia">
</header>

<main id="conteudo" tabindex="-1" class="cartao-login">
  <h1>Praxis</h1>
  <p class="apoio">Gestão de processos, prazos e peças do escritório.</p>

  <p th:if="${mensagem}" class="mensagem sucesso" role="status" th:text="${mensagem}">ok</p>
  <p th:if="${erro}" class="mensagem erro" role="alert" th:text="${erro}">erro</p>

  <form th:action="@{/login}" method="post" class="empilhado">
    <input type="hidden" name="proximo" th:value="${proximo}">
    <label>E-mail do escritorio
      <input type="email" name="email" th:value="${email}" required autofocus
             autocomplete="username" placeholder="contato@seuescritorio.adv.br">
    </label>
    <label>Senha
      <input type="password" name="senha" required autocomplete="current-password">
    </label>
    <button type="submit">Entrar</button>
  </form>

  <p class="dica">
    O login e do escritorio: uma conta so, que depois cadastra os proprios
    advogados dentro do sistema. Ainda nao tem conta?
    <a th:href="@{/cadastro}">Cadastre seu escritorio</a>.
  </p>
</main>
</body>
</html>
