<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="csrf-token" th:content="${csrf}" />
    <title>Praxis - Advogados</title>
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml" />
    <link rel="stylesheet" th:href="${assetCss}" />
    <script th:src="${assetJs}" defer></script>
  </head>
  <body class="app">
    <header th:replace="~{fragmentos :: cabecalho('advogados')}"></header>
    <main id="conteudo" tabindex="-1" data-corpo-juridico th:attr="data-chefe=${usuario.chefe()}">
      <div th:replace="~{fragmentos :: mensagens}"></div>
      <div class="juridico-titulo">
        <div>
          <p class="apoio">PESSOAS &amp; COLABORAÇÃO</p>
          <h1>Corpo jurídico</h1>
          <p class="apoio">Conheça os profissionais do escritório e organize suas equipes.</p>
        </div>
        <button th:if="${usuario.chefe()}" type="button" id="juridico-novo">Cadastrar advogado</button>
      </div>
      <div class="juridico-resumo" aria-label="Resumo do corpo jurídico">
        <div class="cartao">
          <span class="apoio">Advogados cadastrados</span><strong id="total-advogados">—</strong>
        </div>
        <div class="cartao">
          <span class="apoio">Disponíveis para distribuição</span><strong id="total-disponiveis">—</strong>
        </div>
        <div class="cartao">
          <span class="apoio">Equipes do escritório</span><strong id="total-equipes">—</strong>
        </div>
      </div>
      <section class="cartao">
        <div class="juridico-abas" role="tablist" aria-label="Corpo jurídico">
          <button
            type="button"
            role="tab"
            id="aba-advogados"
            aria-selected="true"
            aria-controls="lista-juridico"
            data-aba="advogados"
          >
            Advogados</button
          ><button
            type="button"
            role="tab"
            id="aba-equipes"
            aria-selected="false"
            aria-controls="lista-juridico"
            data-aba="equipes"
            tabindex="-1"
          >
            Equipes
          </button>
        </div>
        <div class="cartao-cabecalho">
          <div>
            <h2 id="titulo-lista">Advogados do escritório</h2>
            <p class="apoio" id="apoio-lista">Selecione um profissional para ver sua ficha completa.</p>
          </div>
          <label class="juridico-busca"
            >Pesquisar<input
              type="search"
              id="juridico-busca"
              placeholder="Nome, OAB, e-mail ou especialidade"
              autocomplete="off"
              list="sugestoes-equipes" /><datalist id="sugestoes-equipes"></datalist
          ></label>
        </div>
        <p id="juridico-feedback" role="status" aria-live="polite"></p>
        <div id="lista-juridico" role="tabpanel" aria-labelledby="aba-advogados" tabindex="0"></div>
      </section>
      <dialog id="juridico-modal" class="juridico-modal" aria-labelledby="modal-titulo">
        <div class="cartao-cabecalho">
          <h2 id="modal-titulo"></h2>
          <button type="button" class="secundario" data-fechar aria-label="Fechar modal">×</button>
        </div>
        <div id="modal-conteudo"></div>
      </dialog>
      <template id="form-advogado"
        ><form class="formulario" data-form-advogado>
          <label>Nome completo<input name="nome" required maxlength="120" autocomplete="name" /></label
          ><label>E-mail<input name="email" type="email" required autocomplete="email" /></label
          ><label>OAB<input name="oab" required maxlength="30" placeholder="PE12345" /></label
          ><label
            >Telefone<input
              name="telefone"
              type="tel"
              autocomplete="tel"
              placeholder="(81) 99999-0000" /></label
          ><label>Especialidade<input name="especialidade" placeholder="Ex.: Direito civil" /></label
          ><label class="marcador"
            ><input name="disponivel" type="checkbox" checked />Disponível para novas distribuições</label
          >
          <p class="apoio" data-oab-aviso hidden>A OAB é mantida após o cadastro.</p>
          <p class="mensagem erro" data-form-erro role="alert" hidden></p>
          <div class="juridico-rodape">
            <button type="button" class="secundario" data-fechar>Cancelar</button
            ><button type="submit">Salvar advogado</button>
          </div>
        </form></template
      >
      <template id="form-equipe"
        ><form class="formulario" data-form-equipe>
          <label
            >Nome da equipe<input name="nome" required maxlength="120" placeholder="Ex.: Contencioso cível"
          /></label>
          <div>
            <h3>Advogados da equipe</h3>
            <p class="apoio">Busque profissionais e selecione quem fará parte da equipe.</p>
            <label
              >Pesquisar advogados<input
                type="search"
                data-busca-membros
                placeholder="Nome, OAB ou especialidade"
                autocomplete="off"
            /></label>
            <p class="apoio" data-contagem-membros aria-live="polite"></p>
            <div class="juridico-membros" data-membros></div>
          </div>
          <p class="mensagem erro" data-form-erro role="alert" hidden></p>
          <div class="juridico-rodape">
            <button type="button" class="secundario" data-fechar>Cancelar</button
            ><button type="submit">Salvar equipe</button>
          </div>
        </form></template
      >
    </main>
  </body>
</html>
