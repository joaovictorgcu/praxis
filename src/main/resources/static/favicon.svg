<?xml version="1.0" encoding="UTF-8"?>
<!--
  Marca do Praxis: hexagono de rede (tecnologia/IA) com balanca da justica
  cujo eixo central e a seta de crescimento. Desenhada para o fundo escuro do
  ladrilho, por isso o <rect> navy vem embutido: a mesma arte serve para o
  menu lateral (34px), o favicon (16px) e o cartao de login.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Praxis">
  <defs>
    <linearGradient id="praxis-ouro" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c9973f"/>
      <stop offset="1" stop-color="#f0d08a"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="44" fill="#14213d"/>

  <!-- malha: so o hexagono externo e os nos, para nao fechar em 16px -->
  <polygon points="100,34 158,67.5 158,134.5 100,168 42,134.5 42,67.5"
           fill="none" stroke="#6fa3d6" stroke-width="4.5" stroke-linejoin="round" opacity=".55"/>
  <g fill="#6fa3d6" opacity=".9">
    <circle cx="100" cy="34" r="6"/><circle cx="158" cy="67.5" r="6"/>
    <circle cx="158" cy="134.5" r="6"/><circle cx="100" cy="168" r="6"/>
    <circle cx="42" cy="134.5" r="6"/><circle cx="42" cy="67.5" r="6"/>
  </g>

  <!-- balanca -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M74,96 H126" stroke-width="7"/>
    <path d="M86,134 H114" stroke-width="7"/>
    <path d="M74,96 V107 M126,96 V107" stroke-width="3.5"/>
    <path d="M64,107 A11,8 0 0 0 84,107" stroke-width="5.5"/>
    <path d="M116,107 A11,8 0 0 0 136,107" stroke-width="5.5"/>
  </g>

  <!-- eixo = seta de crescimento -->
  <path d="M100,132 V86" fill="none" stroke="url(#praxis-ouro)" stroke-width="9" stroke-linecap="round"/>
  <path d="M100,62 87,88 113,88 Z" fill="url(#praxis-ouro)"/>
</svg>
