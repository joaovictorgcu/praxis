# Perfil de producao: PostgreSQL com esquema versionado por Flyway.
#   SPRING_PROFILES_ACTIVE=prod PRAXIS_DB_URL=jdbc:postgresql://host:5432/praxis \
#   PRAXIS_DB_USER=praxis PRAXIS_DB_PASSWORD=... ./mvnw spring-boot:run
#
# A URL pode vir inteira (PRAXIS_DB_URL) ou em partes (PRAXIS_DB_HOST/PORT/NAME):
# o Render entrega os dados do banco separados, um por variavel, e nao ha como
# montar a string JDBC no proprio blueprint.
spring.datasource.url=${PRAXIS_DB_URL:jdbc:postgresql://${PRAXIS_DB_HOST:localhost}:${PRAXIS_DB_PORT:5432}/${PRAXIS_DB_NAME:praxis}}
spring.datasource.username=${PRAXIS_DB_USER:praxis}
spring.datasource.password=${PRAXIS_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# O esquema e do Flyway (src/main/resources/db/migration); o Hibernate so confere.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

spring.h2.console.enabled=false

# Esta instancia e uma demonstracao publica do trabalho: sobe com o escritorio
# de exemplo montado (processos, prazos, peca em revisao, clientes, audiencia,
# contratos e anexo) e com login direto, sem troca de senha no primeiro acesso.
# Para uma instalacao real, basta inverter as tres variaveis abaixo:
#   PRAXIS_DADOS_EXEMPLO=false PRAXIS_EXIGIR_TROCA=true PRAXIS_ADMIN_SENHA=<forte>
praxis.dados-exemplo=${PRAXIS_DADOS_EXEMPLO:true}
praxis.exigir-troca-senha-inicial=${PRAXIS_EXIGIR_TROCA:false}
praxis.senha-inicial=${PRAXIS_SENHA_INICIAL:praxis123}

# Administrador da demonstracao: entra com "admin@admin". O e-mail vem inteiro
# na propriedade, entao nao depende do dominio do escritorio.
praxis.admin.usuario=${PRAXIS_ADMIN_USUARIO:admin@admin}
praxis.admin.senha=${PRAXIS_ADMIN_SENHA:1405}

server.servlet.session.cookie.secure=true

# Atras do proxy da plataforma (Render, Koyeb, Cloud Run) quem termina o TLS e
# o proxy: sem ler X-Forwarded-*, a aplicacao se acha em http e monta redirect
# de login para http://, que o navegador recusa junto com o cookie Secure.
server.forward-headers-strategy=framework

# Plano gratuito costuma dar poucas conexoes de banco: um pool pequeno evita
# tomar todas as conexoes do Postgres compartilhado.
spring.datasource.hikari.maximum-pool-size=${PRAXIS_DB_POOL:5}
