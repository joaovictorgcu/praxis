# Perfil de producao: PostgreSQL com esquema versionado por Flyway.
#   SPRING_PROFILES_ACTIVE=prod PRAXIS_DB_URL=jdbc:postgresql://host:5432/praxis \
#   PRAXIS_DB_USER=praxis PRAXIS_DB_PASSWORD=... PRAXIS_SENHA_INICIAL=... ./mvnw spring-boot:run
spring.datasource.url=${PRAXIS_DB_URL:jdbc:postgresql://localhost:5432/praxis}
spring.datasource.username=${PRAXIS_DB_USER:praxis}
spring.datasource.password=${PRAXIS_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# O esquema e do Flyway (src/main/resources/db/migration); o Hibernate so confere.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

spring.h2.console.enabled=false

# Dados de demonstracao nao entram em producao; feriados, modelos e usuarios
# iniciais entram uma vez (as cargas sao idempotentes: pulam se ja houver dados).
praxis.dados-exemplo=false
praxis.senha-inicial=${PRAXIS_SENHA_INICIAL:troque-esta-senha}
# Admin so existe em prod se PRAXIS_ADMIN_SENHA for informada.
praxis.admin.senha=${PRAXIS_ADMIN_SENHA:}
praxis.exigir-troca-senha-inicial=true

server.servlet.session.cookie.secure=true

# Atras do proxy da plataforma (Render, Koyeb, Cloud Run) quem termina o TLS e
# o proxy: sem ler X-Forwarded-*, a aplicacao se acha em http e monta redirect
# de login para http://, que o navegador recusa junto com o cookie Secure.
server.forward-headers-strategy=framework

# Plano gratuito costuma dar poucas conexoes de banco: um pool pequeno evita
# tomar todas as conexoes do Postgres compartilhado.
spring.datasource.hikari.maximum-pool-size=${PRAXIS_DB_POOL:5}
