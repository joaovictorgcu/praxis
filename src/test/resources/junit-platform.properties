# Este arquivo so e lido na raiz do classpath (src/test/resources). Em
# src/test/resources/features/ ele vira /features/junit-platform.properties e
# o JUnit nunca o abre.

# Execucao serial, de proposito. Todos os @SpringBootTest compartilham o mesmo
# H2 em memoria (jdbc:h2:mem:praxis), entao classes em paralelo disputam as
# mesmas tabelas: um teste que lista feriados ou modelos passa a ver o que o
# outro acabou de cadastrar. A suite roda em ~40s serial; determinismo vale
# mais. Para ligar o paralelismo, primeiro de um banco por classe.
junit.jupiter.execution.parallel.enabled=false

# O relatorio do Cucumber e configurado em CucumberTest: @ConfigurationParameter
# na suite vence este arquivo, entao definir cucumber.plugin aqui nao teria efeito.
